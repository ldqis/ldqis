name: Deploy to GitHub Pages

# research(2026-05): standard Astro static-deploy workflow. Action pins
# match the broader sister-toolchain parity convention: full commit SHAs
# with major.minor.patch comments so the sister-audit can detect drift,
# and the family wave-bumps together. `pages: write` + `id-token: write`
# are scoped to the deploy job (the only step that needs them); the build
# job runs read-only.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The InteFL experiment stats are fetched at build time; this rebuilds when they change.
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Scheduled runs only: compare InteFL's live stats with the copy the site last deployed,
  # ignoring the timestamp the endpoint stamps on every response. If the endpoint is down the
  # run leaves a warning and skips the build, rather than failing every hour until it is back.
  stats-changed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Compare live stats with the deployed copy
        id: diff
        env:
          LIVE: https://gcis-lrvcs-rl.gccis.rit.edu/public/stats
          DEPLOYED: https://dataqualitylabs.com/data/intefl-experiments.json
        run: |
          if ! live=$(curl -fsS --max-time 30 "$LIVE" | jq -S 'del(.generated_at)'); then
            echo "::warning::InteFL stats endpoint unreachable; skipping the rebuild"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(curl -fsS --max-time 30 "$DEPLOYED" | jq -S 'del(.generated_at)' || true)
          if [ "$live" = "$deployed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: stats-changed
    # Pushes and manual runs always build (stats-changed is skipped for them).
    if: >-
      !cancelled()
      && (github.event_name != 'schedule' || needs.stats-changed.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # The domain is set in Settings > Pages (Actions deploys ignore a CNAME file).
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
