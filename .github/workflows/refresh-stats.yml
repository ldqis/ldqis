name: Refresh experiment stats

# research(2026-10): the InteFL experiment stats are fetched at build time, so this checks
# hourly whether they changed and, only then, dispatches the Pages deploy. It is a separate
# workflow so deploy.yml's push and manual runs (and its `pages` concurrency group) are
# untouched; a workflow_dispatch sent with GITHUB_TOKEN does start a run. The check
# (scripts/stats-changed.mjs) validates with the site's own schema, so a payload the build
# would reject never triggers a deploy.
# Source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-stats
  cancel-in-progress: true

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compare live stats with the deployed copy
        id: check
        run: node scripts/stats-changed.mjs

      - name: Deploy the new stats
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main
