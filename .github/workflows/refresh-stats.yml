name: Refresh experiment stats

# research(2026-10): the InteFL experiment stats are fetched at build time, so this checks
# hourly whether they changed and, only then, dispatches the Pages deploy. It is a separate
# workflow so deploy.yml's push and manual runs (and their `pages` concurrency group) are
# untouched; a workflow_dispatch sent with GITHUB_TOKEN does start a run. Numbers are
# normalized before comparing (`.+0`), because jq keeps literals as written (165.0 vs 165).
# Source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-stats
  cancel-in-progress: true

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Redeploy if the live stats differ from the deployed copy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIVE: https://gcis-lrvcs-rl.gccis.rit.edu/public/stats
          DEPLOYED: https://dataqualitylabs.com/data/intefl-experiments.json
        run: |
          # The same fields the site's schema requires; anything else is not a stats payload.
          shape='has("total_experiments") and has("successful_experiments") and has("total_hours")
            and (.experiments_per_week | type == "array")
            and (.experiments_per_dataset | type == "array")
            and (.experiments_per_attack | type == "array")'
          norm='del(.generated_at) | walk(if type == "number" then . + 0 else . end)'
          if ! body=$(curl -fsS --max-time 30 "$LIVE") \
            || ! jq -e "$shape" <<<"$body" >/dev/null 2>&1; then
            echo "::warning::InteFL stats endpoint is down or not serving stats; nothing to do"
            exit 0
          fi
          live=$(jq -S "$norm" <<<"$body")
          deployed=$(curl -fsS --max-time 30 "$DEPLOYED?t=$(date +%s)" | jq -S "$norm" || true)
          if [ "$live" = "$deployed" ]; then
            echo "Stats unchanged"
          else
            echo "Stats changed; dispatching the Pages deploy"
            gh workflow run deploy.yml --ref main
          fi
