# Dependabot version updates: npm + GitHub Actions, weekly, minor/patch
# grouped one PR per ecosystem. Patch batches and every GitHub Actions bump
# auto-merge once CI is green (.github/workflows/dependabot-auto-merge.yml);
# npm minor/major wait for review.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # cooldown: hold new releases 7d (supply-chain); security updates bypass it.
    cooldown:
      default-days: 7
    commit-message:
      # bare prefix; include:scope appends the scope -> "chore(deps):" (not doubled)
      prefix: "chore"
      include: "scope"
    groups:
      # @vitest/* peer-pins the exact vitest version, so a major must land as
      # one PR. First matching group wins; minor/patch still ride `npm` below.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    # SHA-pinned actions get version updates (not security alerts); cooldown holds
    # a freshly-published release 7 days so a compromise can surface before the bump.
    cooldown:
      default-days: 7
    commit-message:
      # bare prefix; include:scope appends the scope -> "ci(deps):" (not doubled)
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
