# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@__CMS_VERSION__/schema/sveltia-cms.json
#
# Sveltia CMS — a browser editor for the existing content collections. It lists
# every person / project / publication / news post and opens each one in a
# pre-filled form, committing back to GitHub. This is the "edit or delete what's
# already there" surface; the GitHub issue forms remain the no-account ADD path.
#
# NOT the served file. This is a template rendered by src/pages/admin/config.yml.ts,
# which substitutes __SITE_URL__ and __BASE_PREFIX__ from astro's `site` + base so
# the live config tracks the site's origin and base with no manual edit. See that endpoint for the why.
#
# Try it locally (Chrome/Edge): `npm run dev`, open the /admin/ page, choose
# "Work with Local Repository". For the live site, sign in with GitHub
# (the sveltia-cms-auth Worker handles OAuth).

backend:
  name: github
  repo: ldqis/ldqis
  # research(2026-06): the CMS commits to an unprotected `cms` branch, not `main`.
  # main requires status checks and GitHub rejects a direct CMS write to it
  # ("required status checks are expected"); Sveltia has no PR/editorial mode yet.
  # .github/workflows/cms-publish.yml bridges cms -> main via an auto-merged PR.
  branch: cms
  # OAuth proxy (Cloudflare Worker) for password-free "Sign in with GitHub".
  base_url: https://ldqis-cms-auth.ajbareaa.workers.dev
  # Only GitHub OAuth on the login screen (no personal-access-token option).
  auth_methods: [oauth]

# Local FS editing during `astro dev` — no auth or proxy needed.
local_backend: true

# Branding — match the LDQIS site instead of Sveltia's defaults. app_title
# replaces the "Sveltia CMS" tab/login title; logo.src sets BOTH the entrance
# logo and the browser-tab favicon (sveltia-cms branding.js). A base64 data URI
# keeps the mark self-contained and base-path-independent. Same orange rounded-square "L" as src/layouts/BaseLayout.astro.
app_title: "LDQIS — RIT"
logo:
  src: "data:image/svg+xml;base64,"

# Only the origin of site_url is consumed for "View on Live Site" links: Sveltia
# takes new URL(site_url).origin and discards the path, so the base path can't
# ride here — it rides on each collection's preview_path via __BASE_PREFIX__. The
# full value below still feeds the "open production site" top-bar link. Both are
# rendered from astro's site + base by src/pages/admin/config.yml.ts.
site_url: __SITE_URL__

# Fallback media location (no collection uses it yet; people override below).
media_folder: public/media
public_folder: /media

# Uploaded filenames are kept as-is by default; slugify them (lowercase,
# hyphenated) so site URLs stay clean. This cannot rename a generic-but-clean
# filename like self.jpg — the Photo field hint carries that convention.
media_libraries:
  all:
    slugify_filename: true

collections:
  - name: people
    label: People
    label_singular: Person
    icon: group
    preview_path: "__BASE_PREFIX__people/{{slug}}/"
    folder: src/content/people
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: name
    summary: "{{name}} · {{role}}"
    # Avatars live beside the cards and are referenced as ./avatars/<file>.
    media_folder: avatars
    public_folder: ./avatars
    fields:
      - {
          label: Initials,
          name: initials,
          widget: string,
          hint: "1-3 letters, shown when there is no photo",
        }
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string, hint: "one line under the name" }
      - { label: Cohort, name: cohort, widget: select, options: [current, past], default: current }
      - {
          label: Order,
          name: order,
          widget: number,
          value_type: int,
          default: 100,
          hint: "lower shows first",
        }
      - {
          label: Photo,
          name: avatar,
          widget: image,
          required: false,
          hint: "name the file after the person before uploading (jane-doe.jpg) — all avatars share one folder, so a reused generic name like self.jpg replaces the previous person's photo",
        }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Website, name: website, widget: string, required: false }
      - {
          label: GitHub handle,
          name: github,
          widget: string,
          required: false,
          hint: "just the handle, not a URL",
        }
      - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
      - { label: YouTube URL, name: youtube, widget: string, required: false }
      - { label: Google Scholar URL, name: scholar, widget: string, required: false }
      - { label: IEEE Xplore URL, name: ieee, widget: string, required: false }
      - { label: ORCID iD, name: orcid, widget: string, required: false }
      - { label: Years in the lab, name: years, widget: string, required: false }
      - { label: Lab lead, name: lead, widget: boolean, required: false, default: false }

  - name: publications
    label: Publications
    label_singular: Publication
    icon: menu_book
    preview_path: "__BASE_PREFIX__publications/{{slug}}/"
    folder: src/content/publications
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{year}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Authors (citation form),
          name: authors,
          widget: string,
          hint: "e.g. D. Korobeinikov, R. Zatsarenko, L. Reznik",
        }
      - { label: Year, name: year, widget: string }
      - { label: Venue or publisher, name: venue, widget: string }
      - {
          label: Type,
          name: venue_type,
          widget: select,
          options: [journal, conference, book],
          default: conference,
        }
      - { label: ISBN (books only), name: isbn, widget: string, required: false }
      - label: Link
        name: link
        widget: object
        fields:
          - { label: Label, name: label, widget: string, default: "DOI ↗" }
          - { label: URL, name: href, widget: string }
      - label: Author profile links
        name: author_ids
        widget: relation
        required: false
        multiple: true
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - {
          label: Abstract / about this book,
          name: body,
          widget: markdown,
          required: false,
          hint: "Recommended: shown on the publication's page",
        }

  - name: projects
    label: Projects
    label_singular: Project
    icon: deployed_code
    preview_path: "__BASE_PREFIX__projects/{{slug}}/"
    folder: src/content/projects
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: name
    summary: "{{name}} · {{tagline}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Tagline, name: tagline, widget: string }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - {
          label: Stack,
          name: stack,
          widget: list,
          field: { label: Item, name: item, widget: string },
        }
      - { label: Description, name: desc, widget: text, hint: "inline HTML allowed" }
      - label: Links
        name: links
        widget: list
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: href, widget: string }
      - label: Contributors
        name: contributors
        widget: relation
        required: false
        multiple: true
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { label: Order, name: order, widget: number, value_type: int, default: 100 }
      - label: Kind
        name: kind
        widget: select
        default: research
        options:
          - { label: Research project, value: research }
          - { label: Software tool, value: software }

  - name: news
    label: News
    label_singular: Post
    icon: newspaper
    preview_path: "__BASE_PREFIX__news/{{slug}}/"
    folder: src/content/news
    media_folder: images
    public_folder: ./images
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{pubDate}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Summary,
          name: summary,
          widget: string,
          hint: "max 280 chars; shown in lists + RSS",
        }
      - {
          label: Publish date,
          name: pubDate,
          widget: datetime,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - { label: Author, name: author, widget: string, default: LDQIS }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Cover photo, name: cover, widget: image, required: false }
      - {
          label: Cover photo description,
          name: coverAlt,
          widget: string,
          required: false,
          hint: "required with a photo: describe what it shows for people who can't see it",
        }
      - {
          label: Cover photo caption,
          name: coverCaption,
          widget: string,
          required: false,
          hint: "shown under the photo; credit the photographer",
        }
      - {
          label: Tags,
          name: tags,
          widget: list,
          required: false,
          field: { label: Tag, name: tag, widget: string },
        }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
