# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@__CMS_VERSION__/schema/sveltia-cms.json
#
# Sveltia CMS — a browser editor for the existing content collections. It lists
# every person / project / publication / news post and opens each one in a
# pre-filled form, committing back to GitHub. This is the "edit or delete what's
# already there" surface; the GitHub issue forms remain the no-account ADD path.
#
# NOT the served file. This is a template rendered by src/pages/admin/config.yml.ts,
# which substitutes __SITE_URL__ and __BASE_PREFIX__ from astro's `site` + base so
# the live config tracks the site's origin and base with no manual edit. See that endpoint for the why.
#
# Try it locally (Chrome/Edge): `npm run dev`, open the /admin/ page, choose
# "Work with Local Repository". For the live site, sign in with GitHub
# (the sveltia-cms-auth Worker handles OAuth).

backend:
  name: github
  repo: ldqis/ldqis
  # research(2026-06): the CMS commits to an unprotected `cms` branch, not `main`.
  # main requires status checks and GitHub rejects a direct CMS write to it
  # ("required status checks are expected"); Sveltia has no PR/editorial mode yet.
  # .github/workflows/cms-publish.yml bridges cms -> main via an auto-merged PR.
  branch: cms
  # OAuth proxy (Cloudflare Worker) for password-free "Sign in with GitHub".
  base_url: https://ldqis-cms-auth.ajbareaa.workers.dev
  # Only GitHub OAuth on the login screen (no personal-access-token option).
  auth_methods: [oauth]

# Local FS editing during `astro dev` — no auth or proxy needed.
local_backend: true

# Branding — match the LDQIS site instead of Sveltia's defaults. app_title
# replaces the "Sveltia CMS" tab/login title; logo.src sets BOTH the entrance
# logo and the browser-tab favicon (sveltia-cms branding.js). A base64 data URI
# keeps the mark self-contained and base-path-independent. Same orange rounded-square "L" as src/layouts/BaseLayout.astro.
app_title: "LDQIS — RIT"
logo:
  src: "data:image/svg+xml;base64,"

# Only the origin of site_url is consumed for "View on Live Site" links: Sveltia
# takes new URL(site_url).origin and discards the path, so the base path can't
# ride here — it rides on each collection's preview_path via __BASE_PREFIX__. The
# full value below still feeds the "open production site" top-bar link. Both are
# rendered from astro's site + base by src/pages/admin/config.yml.ts.
site_url: __SITE_URL__

# Leave unfilled optional fields out of the saved file, so a card holds only what was entered.
output:
  omit_empty_optional_fields: true

# Fallback media location (no collection uses it yet; people override below).
media_folder: public/media
public_folder: /media

# Uploaded filenames are kept as-is by default; slugify them (lowercase,
# hyphenated) so site URLs stay clean. This cannot rename a generic-but-clean
# filename like self.jpg — the Photo field hint carries that convention.
media_libraries:
  all:
    slugify_filename: true

collections:
  - name: people
    label: People
    label_singular: Person
    description: "Everyone on the site's People page. Search for your name to update your card, or choose **New** to add yourself."
    icon: group
    preview_path: "__BASE_PREFIX__people/{{slug}}/"
    folder: src/content/people
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: name
    summary: "{{name}} · {{role}}"
    view_groups:
      groups:
        - { name: cohort, label: Current and past members, field: cohort }
      default: cohort
    # Each person's photo goes in a folder named after their card, so two uploads named
    # photo.jpg can never replace each other.
    media_folder: "avatars/{{filename}}"
    public_folder: "./avatars/{{filename}}"
    # Rules shared with the build (src/lib/profile-fields.ts); __PATTERN_*__ and the
    # __YEARS_*__ option lists are filled in by src/pages/admin/config.yml.ts.
    fields:
      - label: Name
        name: name
        widget: string
        unique: true
        hint: "As it should appear on the site, for example Dr. Jane Doe"
      - label: Role
        name: role
        widget: string
        hint: "One line under your name: your position, focus or a paper you're proud of"
      - label: Photo
        name: avatar
        widget: image
        required: false
        hint: "A square photo of your face works best. Without one, the site shows your GitHub picture, then your initials."
      - label: In the lab since
        name: years_from
        widget: select
        required: false
        options: __YEARS_FROM_OPTIONS__
      - label: Until
        name: years_to
        widget: select
        required: false
        options: __YEARS_TO_OPTIONS__
        hint: "Pick Present if you're still in the lab"
      - label: In the lab now?
        name: cohort
        widget: select
        default: current
        options:
          - { label: Current member, value: current }
          - { label: Past member, value: past }
      - { label: Email, name: email, widget: string, type: email, required: false }
      - label: Website
        name: website
        widget: string
        type: url
        required: false
        hint: "The full link, starting with https://"
      - label: GitHub username
        name: github
        widget: string
        required: false
        pattern: [__PATTERN_GITHUB__]
        hint: "Just the username, like ajbarea"
      - label: LinkedIn
        name: linkedin
        widget: string
        type: url
        required: false
        pattern: [__PATTERN_LINKEDIN__]
      - label: YouTube
        name: youtube
        widget: string
        type: url
        required: false
        pattern: [__PATTERN_YOUTUBE__]
      - label: Google Scholar
        name: scholar
        widget: string
        type: url
        required: false
        pattern: [__PATTERN_SCHOLAR__]
      - label: IEEE Xplore
        name: ieee
        widget: string
        type: url
        required: false
        pattern: [__PATTERN_IEEE__]
      - label: ORCID iD
        name: orcid
        widget: string
        required: false
        pattern: [__PATTERN_ORCID__]
        hint: "Like 0000-0002-1825-0097"
      - label: Lab director
        name: lead
        widget: boolean
        required: false
        default: false
        hint: "On for Dr. Reznik only: his card is wider"
      - label: Position on the team list
        name: order
        widget: number
        value_type: int
        min: 1
        default: 100
        hint: "Lower numbers show first. Lab admins set this; new members can leave it."
      - label: Initials
        name: initials
        widget: string
        required: false
        maxlength: 3
        hint: "Shown when there is no photo. Leave blank to use your name's first letters."

  - name: publications
    label: Publications
    label_singular: Publication
    description: "Papers and books on the site. Turn on **Feature on the homepage** only for the lab's strongest recent work."
    icon: menu_book
    preview_path: "__BASE_PREFIX__publications/{{slug}}/"
    folder: src/content/publications
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{year}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Authors (citation form),
          name: authors,
          widget: string,
          hint: "e.g. D. Korobeinikov, R. Zatsarenko, L. Reznik",
        }
      - {
          label: Year,
          name: year,
          widget: string,
          pattern: ["^\\d{4}$", "Enter the four-digit year, like 2026"],
        }
      - { label: Venue or publisher, name: venue, widget: string }
      - {
          label: Type,
          name: venue_type,
          widget: select,
          options: [journal, conference, book],
          default: conference,
        }
      - { label: ISBN (books only), name: isbn, widget: string, required: false }
      - label: Link
        name: link
        widget: object
        fields:
          - { label: Label, name: label, widget: string, default: "DOI ↗" }
          - { label: URL, name: href, widget: string, type: url }
      - label: Author profile links
        name: author_ids
        widget: relation
        required: false
        multiple: true
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - {
          label: Feature on the homepage,
          name: featured,
          widget: boolean,
          default: false,
          required: false,
          hint: "Selected publications shows only featured entries; keep it to the lab's strongest recent work",
        }
      - {
          label: Abstract / about this book,
          name: body,
          widget: markdown,
          required: false,
          hint: "Recommended: shown on the publication's page",
        }

  - name: projects
    label: Projects
    label_singular: Project
    description: "Research projects and the software tools the lab builds."
    icon: deployed_code
    preview_path: "__BASE_PREFIX__projects/{{slug}}/"
    folder: src/content/projects
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: name
    summary: "{{name}} · {{tagline}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Tagline, name: tagline, widget: string }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - {
          label: Stack,
          name: stack,
          widget: list,
          field: { label: Item, name: item, widget: string },
        }
      - { label: Description, name: desc, widget: text, hint: "inline HTML allowed" }
      - label: Links
        name: links
        widget: list
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: href, widget: string }
      - label: Contributors
        name: contributors
        widget: relation
        required: false
        multiple: true
        collection: people
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { label: Order, name: order, widget: number, value_type: int, default: 100 }
      - label: Kind
        name: kind
        widget: select
        default: research
        options:
          - { label: Research project, value: research }
          - { label: Software tool, value: software }

  - name: news
    label: News
    label_singular: Post
    description: "News posts. Turn on **Draft** to save a post without publishing it."
    icon: newspaper
    preview_path: "__BASE_PREFIX__news/{{slug}}/"
    folder: src/content/news
    media_folder: images
    public_folder: ./images
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{pubDate}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Summary,
          name: summary,
          widget: string,
          maxlength: 280,
          hint: "One or two sentences, shown in the news list and the RSS feed",
        }
      - {
          label: Publish date,
          name: pubDate,
          widget: datetime,
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - { label: Author, name: author, widget: string, default: LDQIS }
      - { label: Description, name: description, widget: string, required: false }
      - { label: Cover photo, name: cover, widget: image, required: false }
      - {
          label: Cover photo description,
          name: coverAlt,
          widget: string,
          required: false,
          hint: "required with a photo: describe what it shows for people who can't see it",
        }
      - {
          label: Cover photo caption,
          name: coverCaption,
          widget: string,
          required: false,
          hint: "shown under the photo; credit the photographer",
        }
      - {
          label: Tags,
          name: tags,
          widget: list,
          required: false,
          field: { label: Tag, name: tag, widget: string },
        }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
